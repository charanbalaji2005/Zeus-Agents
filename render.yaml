services:
  - type: web
    name: zeus-agent-portal
    # Landing page only. The root ./Dockerfile is the full agent image and never serves $PORT.
    runtime: docker
    dockerfilePath: ./Dockerfile.landing
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        value: 644632951361-d2j5eiu4ur41abjafjrtcpk5oenh4d6r.apps.googleusercontent.com
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
