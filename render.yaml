services:
  - type: web
    name: zeus-cli-server
    # Zeus CLI Server, Interactive Web Terminal (/cli) and Marketing Landing Page
    runtime: docker
    dockerfilePath: ./Dockerfile.cli
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: GOOGLE_CLIENT_ID
        value: 644632951361-d2j5eiu4ur41abjafjrtcpk5oenh4d6r.apps.googleusercontent.com
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
